[project]
name = "api-detection-project"
version = "0.1.0"
description = "Rule-based analysis and risk scoring for API requests"
readme = "README.md"
authors = [
    { name = "Bradley Ryan", email = "bradley.wally.ryan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.3",
]

[project.scripts]
api-detection-project = "api_detection_project:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
